name: Medical Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Lint with pylint
      run: |
        pip install pylint
        pylint app.py src/ --exit-zero || true
      continue-on-error: true
    
    - name: Check code style with flake8
      run: |
        pip install flake8
        flake8 app.py src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
      continue-on-error: true
    
    - name: Run unit tests
      run: |
        pytest test_suite.py -v --tb=short --color=yes
    
    - name: Run tests with coverage
      run: |
        pytest test_suite.py --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate coverage report
      if: always()
      run: |
        echo "Coverage report generated at htmlcov/index.html"
        echo "Visit htmlcov/index.html for detailed coverage information"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r app.py src/ -ll || true
      continue-on-error: true
    
    - name: Check for vulnerable dependencies
      run: |
        pip install -r requirements.txt
        safety check --json || true
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint black isort mypy
    
    - name: Check formatting with black
      run: |
        black --check app.py src/ || true
      continue-on-error: true
    
    - name: Check import ordering with isort
      run: |
        isort --check-only app.py src/ || true
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy app.py --ignore-missing-imports || true
      continue-on-error: true

  smoke-tests:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Start application in background
      run: |
        python app.py > /tmp/app.log 2>&1 &
        sleep 5
      continue-on-error: true
    
    - name: Run smoke tests
      run: |
        pytest test_suite.py -v -m "smoke" || true
      continue-on-error: true

  build-notification:
    runs-on: ubuntu-latest
    needs: [test, security-scan, code-quality]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        echo "✅ All CI/CD checks completed!"
        echo "Test Status: ${{ needs.test.result }}"
        echo "Security Scan Status: ${{ needs.security-scan.result }}"
        echo "Code Quality Status: ${{ needs.code-quality.result }}"
