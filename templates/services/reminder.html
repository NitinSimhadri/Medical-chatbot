<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Reminders - MediBot AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg-light: #ffffff; --bg-lighter: #f8fafc; --text-dark: #1e293b; --text-light: #64748b; --border: #e2e8f0; }
        body[data-theme="dark"] { --bg-light: #0f172a; --bg-lighter: #1e293b; --text-dark: #f8fafc; --text-light: #cbd5e1; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-lighter), var(--bg-light)); color: var(--text-dark); min-height: 100vh; padding: 2rem; padding-top: 6rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 0; }
        body[data-theme="dark"] .navbar { background: rgba(15, 23, 42, 0.95); }
        .navbar-content { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-link { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .card { background: var(--bg-light); border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 2rem; }
        h1, h2 { color: var(--text-dark); margin-bottom: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg-lighter); color: var(--text-dark); font-family: 'Inter', sans-serif; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
        .reminder-item { background: var(--bg-lighter); padding: 1rem; border-radius: 0.5rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .reminder-time { font-weight: 600; color: var(--primary); }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo"><i class="fas fa-heartbeat"></i> MediBot AI</a>
            <a href="/" class="nav-link">← Back to Chat</a>
        </div>
    </nav>

    <div class="container">
        <h1><i class="fas fa-bell"></i> Smart Reminders</h1>

        <div class="card">
            <h2>Set New Reminder</h2>
            <form onsubmit="addReminder(event)">
                <div class="form-group">
                    <label for="reminder-type">Reminder Type</label>
                    <select id="reminder-type" required>
                        <option value="">Select type</option>
                        <option value="medication">💊 Take Medication</option>
                        <option value="checkup">📋 Doctor Checkup</option>
                        <option value="vitals">📊 Check Vitals</option>
                        <option value="exercise">🏃 Exercise</option>
                        <option value="appointment">📅 Appointment</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reminder-time">Time</label>
                    <input type="time" id="reminder-time" required>
                </div>
                <div class="form-group">
                    <label for="reminder-frequency">Frequency</label>
                    <select id="reminder-frequency" required>
                        <option value="once">Once</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reminder-note">Notes (optional)</label>
                    <input type="text" id="reminder-note" placeholder="Add any notes...">
                </div>
                <button type="submit" class="btn">Set Reminder</button>
            </form>
        </div>

        <div class="card">
            <h2>Your Reminders</h2>
            <div id="reminders-list">
                <div class="reminder-item">
                    <div>
                        <strong>💊 Take Medication</strong><br>
                        <small style="color: var(--text-light);">Aspirin 500mg</small>
                    </div>
                    <span class="reminder-time">08:00 AM</span>
                </div>
                <div class="reminder-item">
                    <div>
                        <strong>📊 Check Vitals</strong><br>
                        <small style="color: var(--text-light);">Blood Pressure</small>
                    </div>
                    <span class="reminder-time">06:00 PM</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addReminder(e) {
            e.preventDefault();
            const type = document.getElementById('reminder-type').value;
            const time = document.getElementById('reminder-time').value;
            const frequency = document.getElementById('reminder-frequency').value;
            const note = document.getElementById('reminder-note').value;

            const list = document.getElementById('reminders-list');
            const item = document.createElement('div');
            item.className = 'reminder-item';
            item.innerHTML = `
                <div>
                    <strong>${type}</strong><br>
                    <small style="color: var(--text-light);">${note || 'Reminder'}</small>
                </div>
                <span class="reminder-time">${time}</span>
            `;
            list.appendChild(item);

            document.querySelector('form').reset();
            alert('Reminder set successfully!');
        }

        document.body.setAttribute('data-theme', localStorage.getItem('medibot-theme') || 'light');
    </script>
</body>
</html>
