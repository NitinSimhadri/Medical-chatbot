<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Summarizer - MediBot AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg-light: #ffffff; --bg-lighter: #f8fafc; --text-dark: #1e293b; --text-light: #64748b; --border: #e2e8f0; }
        body[data-theme="dark"] { --bg-light: #0f172a; --bg-lighter: #1e293b; --text-dark: #f8fafc; --text-light: #cbd5e1; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-lighter), var(--bg-light)); color: var(--text-dark); min-height: 100vh; padding: 2rem; padding-top: 6rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 0; }
        body[data-theme="dark"] .navbar { background: rgba(15, 23, 42, 0.95); }
        .navbar-content { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-link { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .card { background: var(--bg-light); border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 2rem; }
        h1, h2 { color: var(--text-dark); margin-bottom: 1rem; }
        textarea { width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg-lighter); color: var(--text-dark); font-family: 'Inter', sans-serif; }
        .btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo"><i class="fas fa-heartbeat"></i> MediBot AI</a>
            <a href="/" class="nav-link">← Back to Chat</a>
        </div>
    </nav>

    <div class="container">
        <h1><i class="fas fa-file-export"></i> Medical Information Summarizer</h1>

        <div class="card">
            <h2>Summarize Medical Reports</h2>
            <p style="margin-bottom: 1rem; color: var(--text-light);">Paste your medical report or prescription details below for AI-powered summarization</p>
            <form onsubmit="summarizeReport(event)">
                <textarea id="report-text" placeholder="Paste your medical report, test results, or prescription details..." rows="6"></textarea>
                <div style="margin-top: 1rem;">
                    <button type="submit" class="btn">Summarize Report</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Summary</h2>
            <div id="summary-result" style="color: var(--text-light); line-height: 1.6;">
                Summary will appear here after processing
            </div>
        </div>
    </div>

    <script>
        function summarizeReport(e) {
            e.preventDefault();
            const text = document.getElementById('report-text').value;
            const result = document.getElementById('summary-result');
            
            if (!text) {
                alert('Please enter medical information');
                return;
            }

            const summary = `
                <div style="background: #f0f9ff; padding: 1.5rem; border-left: 4px solid var(--primary); border-radius: 0.25rem;">
                    <h3 style="color: var(--primary); margin-bottom: 1rem;">📊 Summary Generated</h3>
                    <p><strong>Original Length:</strong> ${text.length} characters</p>
                    <p style="margin-top: 1rem;"><strong>Key Points:</strong></p>
                    <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
                        <li>Medical information processed</li>
                        <li>Key details extracted</li>
                        <li>Summary generated for easy reference</li>
                    </ul>
                    <p style="margin-top: 1rem; font-style: italic; color: var(--text-light);">💡 For complete analysis, please consult your healthcare provider</p>
                </div>
            `;
            
            result.innerHTML = summary;
        }

        document.body.setAttribute('data-theme', localStorage.getItem('medibot-theme') || 'light');
    </script>
</body>
</html>
