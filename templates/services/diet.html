<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Planner - MediBot AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-light: #ffffff;
            --bg-lighter: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        body[data-theme="dark"] {
            --bg-light: #0f172a;
            --bg-lighter: #1e293b;
            --text-dark: #f8fafc;
            --text-light: #cbd5e1;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-lighter), var(--bg-light)); color: var(--text-dark); min-height: 100vh; padding: 2rem; padding-top: 6rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 0; }
        body[data-theme="dark"] .navbar { background: rgba(15, 23, 42, 0.95); }
        .navbar-content { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-link { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .card { background: var(--bg-light); border-radius: 1rem; padding: 2rem; box-shadow: var(--shadow-md); border: 1px solid var(--border); margin-bottom: 2rem; }
        h1, h2 { color: var(--text-dark); margin-bottom: 1rem; }
        p { line-height: 1.6; color: var(--text-light); margin-bottom: 1rem; }
        ul { margin-left: 1.5rem; margin-bottom: 1rem; }
        li { line-height: 1.6; margin-bottom: 0.5rem; color: var(--text-light); }
        .form-group { margin-bottom: 1.5rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg-lighter); color: var(--text-dark); font-family: 'Inter', sans-serif; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
        .result-box { background: var(--bg-lighter); padding: 1.5rem; border-radius: 0.75rem; margin: 1.5rem 0; border: 1px solid var(--border); display: none; }
        .result-box.show { display: block; }
        .calorie-value { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .meal-item { background: var(--bg-light); padding: 1rem; border-radius: 0.5rem; border-left: 4px solid var(--primary); }
        .meal-time { font-weight: 600; color: var(--text-dark); }
        .meal-desc { color: var(--text-light); margin-top: 0.5rem; font-size: 0.9rem; }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo"><i class="fas fa-heartbeat"></i> MediBot AI</a>
            <a href="/" class="nav-link">← Back to Chat</a>
        </div>
    </nav>

    <div class="container">
        <h1>Simple Diet Planner</h1>
        <p>This planner gives a basic caloric estimate and simple meal suggestions based on goals. It is educational only.</p>
        <form id="dietForm">
            <label>Age: <input type="number" id="age" required></label><br/><br/>
            <label>Height (cm): <input type="number" id="height" required></label><br/><br/>
            <label>Weight (kg): <input type="number" id="weight" required></label><br/><br/>
            <label>Activity level:
                <select id="activity">
                    <option value="1.2">Sedentary</option>
                    <option value="1.375">Light</option>
                    <option value="1.55">Moderate</option>
                    <option value="1.725">Active</option>
                </select>
            </label><br/><br/>
            <label>Goal:
                <select id="goal">
                    <option value="maintain">Maintain weight</option>
                    <option value="loss">Mild weight loss</option>
                    <option value="gain">Mild weight gain</option>
                </select>
            </label><br/><br/>
            <button type="submit">Get Plan</button>
        </form>
        <div id="plan" style="margin-top:16px"></div>
        <p><a href="/">Return to chat</a></p>
    </div>
    <script>
        document.getElementById('dietForm').addEventListener('submit', function(e){
            e.preventDefault();
            const age = +document.getElementById('age').value;
            const h = +document.getElementById('height').value;
            const w = +document.getElementById('weight').value;
            const activity = +document.getElementById('activity').value;
            const goal = document.getElementById('goal').value;
            if(!age||!h||!w){ document.getElementById('plan').innerText='Enter valid values'; return }
            // Mifflin-St Jeor (male/female unknown) — use average
            const bmr = 10*w + 6.25*h - 5*age + 5; // estimate
            let calories = Math.round(bmr * activity);
            if(goal==='loss') calories = Math.round(calories - 300);
            if(goal==='gain') calories = Math.round(calories + 300);
            const html = `<p>Estimated daily calories: <strong>${calories} kcal</strong></p>
                <p>Sample simple meals:</p>
                <ul>
                    <li>Breakfast: Oats with fruit and nuts</li>
                    <li>Lunch: Lean protein + vegetables + whole grains</li>
                    <li>Snack: Yogurt or fruit</li>
                    <li>Dinner: Fish/legumes + salad or cooked vegetables</li>
                </ul>`;
            document.getElementById('plan').innerHTML = html;
        })
    </script>
</body>
</html>
