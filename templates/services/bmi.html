<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - MediBot AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-light: #ffffff;
            --bg-lighter: #f8fafc;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        body[data-theme="dark"] {
            --bg-light: #0f172a;
            --bg-lighter: #1e293b;
            --text-dark: #f8fafc;
            --text-light: #cbd5e1;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-lighter), var(--bg-light)); color: var(--text-dark); min-height: 100vh; padding: 2rem; padding-top: 6rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        .navbar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 0; }
        body[data-theme="dark"] .navbar { background: rgba(15, 23, 42, 0.95); }
        .navbar-content { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-link { color: var(--text-light); text-decoration: none; font-weight: 500; }
        .card { background: var(--bg-light); border-radius: 1rem; padding: 2rem; box-shadow: var(--shadow-md); border: 1px solid var(--border); margin-bottom: 2rem; }
        h1, h2 { color: var(--text-dark); margin-bottom: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg-lighter); color: var(--text-dark); font-family: 'Inter', sans-serif; }
        input:focus { outline: none; border-color: var(--primary); }
        .btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
        .result { background: var(--bg-lighter); padding: 1.5rem; border-radius: 0.75rem; margin-top: 1.5rem; border: 1px solid var(--border); }
        .bmi-value { font-size: 2.5rem; font-weight: 700; color: var(--primary); text-align: center; }
        .bmi-category { font-size: 1.25rem; text-align: center; color: var(--text-light); margin-top: 0.5rem; }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo"><i class="fas fa-heartbeat"></i> MediBot AI</a>
            <a href="/" class="nav-link">← Back to Chat</a>
        </div>
    </nav>

    <div class="container">
        <h1>BMI Calculator</h1>
        <p>Use this calculator to estimate Body Mass Index (BMI).</p>
        <form id="bmiForm">
            <label>Height (cm): <input type="number" id="height" required></label><br/><br/>
            <label>Weight (kg): <input type="number" id="weight" required></label><br/><br/>
            <button type="submit">Calculate BMI</button>
        </form>
        <div id="bmiResult" style="margin-top:16px;font-weight:600;"></div>
        <p><a href="/">Return to chat</a></p>
    </div>
    <script>
        document.getElementById('bmiForm').addEventListener('submit', function(e){
            e.preventDefault();
            const h = parseFloat(document.getElementById('height').value)/100;
            const w = parseFloat(document.getElementById('weight').value);
            if(!h || !w){ document.getElementById('bmiResult').innerText = 'Enter valid height and weight.'; return }
            const bmi = (w / (h*h)).toFixed(1);
            let cat = '';
            if(bmi < 18.5) cat = 'Underweight';
            else if(bmi < 25) cat = 'Normal';
            else if(bmi < 30) cat = 'Overweight';
            else cat = 'Obese';
            document.getElementById('bmiResult').innerText = `BMI: ${bmi} — ${cat}`;
        })
    </script>
</body>
</html>
