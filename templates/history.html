<!DOCTYPE html>
<html>
<head>
    <title>Chat History - Medical Chatbot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Your Chat History</h3>
                        <a href="/" class="btn btn-primary">Back to Chat</a>
                    </div>
                    <div class="card-body">
                        {% if history %}
                            {% for message in history %}
                            <div class="mb-4">
                                <div class="d-flex justify-content-end mb-2">
                                    <div class="msg_cotainer_send">
                                        {{ message.user }}
                                        <span class="msg_time_send">{{ message.timestamp[:19] }}</span>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-start">
                                    <div class="msg_cotainer">
                                        {{ message.bot }}
                                        <span class="msg_time">{{ message.timestamp[:19] }}</span>
                                    </div>
                                </div>
                            </div>
                            {% endfor %}
                        {% else %}
                            <p>No chat history found.</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
